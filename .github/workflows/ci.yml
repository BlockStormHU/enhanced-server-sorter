name: CI

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]
    paths-ignore:
      - '**.md'
      - '.idea/**'
      - '.githooks/**'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.idea/**'
      - '.githooks/**'
      - 'LICENSE'
  schedule:
    # weekly on the default branch: catches dependency, platform and toolchain drift
    - cron: '5 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a newer commit replaces the older run of the same branch; the default branch keeps every run
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Lint PHP
        run: find src database lang -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate plugin.json and update.json
        run: |
          jq -e '
            .id == "enhanced-server-sorter"
            and (.name | type == "string")
            and (.namespace | type == "string")
            and (.class | type == "string")
            and (.version | type == "string")
            and (.api_version == 1)
          ' plugin.json > /dev/null
          jq -e '."*".version and ."*".download_url' update.json > /dev/null

          PLUGIN_VERSION="$(jq -r .version plugin.json)"
          UPDATE_VERSION="$(jq -r '."*".version' update.json)"
          if [ "$PLUGIN_VERSION" != "$UPDATE_VERSION" ]; then
            echo "::error file=update.json::update.json version $UPDATE_VERSION does not match plugin.json version $PLUGIN_VERSION"
            exit 1
          fi

      - name: Check translation keys
        run: |
          php <<'PHP'
          <?php
          $base = array_keys(require 'lang/en/messages.php');
          $failed = false;
          foreach (glob('lang/*/messages.php') as $file) {
              $keys = array_keys(require $file);
              $missing = array_diff($base, $keys);
              $extra = array_diff($keys, $base);
              if ($missing || $extra) {
                  $failed = true;
                  echo "::error file=$file::missing: " . implode(', ', $missing) . '; extra: ' . implode(', ', $extra) . PHP_EOL;
              }
          }
          exit($failed ? 1 : 0);
          PHP
