name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (for example v1.4.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Resolve version
        id: release
        run: |
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version (expected e.g. v1.4.0 or 1.4.0-beta)"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "update_url=https://raw.githubusercontent.com/$REPOSITORY/$DEFAULT_BRANCH/update.json" >> "$GITHUB_OUTPUT"
          echo "download_url=https://github.com/$REPOSITORY/releases/download/$TAG/enhanced-server-sorter.zip" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          path: enhanced-server-sorter
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Lint PHP
        # A release must never ship code that doesn't parse (1.4.0 did); CI runs the same check.
        run: find enhanced-server-sorter/src enhanced-server-sorter/database enhanced-server-sorter/lang -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          path: metadata

      - name: Build plugin zip
        id: zip
        env:
          VERSION: ${{ steps.release.outputs.version }}
          UPDATE_URL: ${{ steps.release.outputs.update_url }}
        run: |
          cd enhanced-server-sorter
          jq --arg version "$VERSION" --arg update_url "$UPDATE_URL" \
            '.version = $version | .update_url = $update_url' plugin.json > plugin.json.tmp
          mv plugin.json.tmp plugin.json
          rm -rf .git .github .idea dist CLAUDE.md
          cd ..

          zip -qr enhanced-server-sorter.zip enhanced-server-sorter
          unzip -l enhanced-server-sorter.zip
          echo "sha256=$(sha256sum enhanced-server-sorter.zip | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: enhanced-server-sorter
          path: enhanced-server-sorter.zip

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" enhanced-server-sorter.zip --repo "$REPOSITORY" --clobber

      - name: Commit release metadata
        env:
          VERSION: ${{ steps.release.outputs.version }}
          UPDATE_URL: ${{ steps.release.outputs.update_url }}
          DOWNLOAD_URL: ${{ steps.release.outputs.download_url }}
          SHA256: ${{ steps.zip.outputs.sha256 }}
        run: |
          cd metadata
          jq --arg version "$VERSION" --arg update_url "$UPDATE_URL" \
            '.version = $version | .update_url = $update_url' plugin.json > plugin.json.tmp
          mv plugin.json.tmp plugin.json
          jq -n --arg version "$VERSION" --arg url "$DOWNLOAD_URL" --arg sha256 "$SHA256" \
            '{"*": {version: $version, download_url: $url, sha256: $sha256}}' > update.json
          cat update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin.json update.json

          if git diff --staged --quiet; then
            echo "Metadata already up to date"
            exit 0
          fi

          git commit -m "Update release metadata to version $VERSION"
          for attempt in 1 2 3; do
            git pull --rebase origin "$DEFAULT_BRANCH" && git push origin "HEAD:$DEFAULT_BRANCH" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
